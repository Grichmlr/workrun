
name: Android validation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate and build unsigned candidate
        run: gradle --no-daemon lintRelease assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: WorkRun-2.2-UNSIGNED-AAB-and-DEBUG-APK
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-release.html
